# Canonical interoperability catalog: fourteen executable [[kernels]] entries
# and two additional [[manual_validations]] with known limitations.
# The installer reads only [[kernels]]; manual records are not install recipes.
# `kernelspec` is the commonly used name; installations may register another
# name. Use `jupyter kernelspec list --json` to discover local names.

[[kernels]]
id = "python-ipykernel"
display_name = "Python (ipykernel)"
language = "python"
kernelspec = "python3"
tier = "required"
project_url = "https://github.com/ipython/ipykernel"

[kernels.micromamba]
channels = ["conda-forge"]
packages = ["ipykernel"]

[[kernels]]
id = "julia-ijulia"
display_name = "Julia (IJulia)"
language = "julia"
kernelspec = "julia"
tier = "optional"
project_url = "https://github.com/JuliaLang/IJulia.jl"

[kernels.micromamba]
channels = ["conda-forge"]
packages = ["juliaup"]
setup = [
  ["juliaup", "add", "release"],
  ["julia", "+release", "-e", "using Pkg; Pkg.add(\"IJulia\")"],
]

[[kernels]]
id = "r-irkernel"
display_name = "R (IRkernel)"
language = "R"
kernelspec = "ir"
tier = "optional"
project_url = "https://github.com/IRkernel/IRkernel"

[kernels.micromamba]
channels = ["conda-forge"]
packages = ["r-irkernel"]

[[kernels]]
# Retain the legacy ID so existing environment directories remain usable.
# Tested xeus-cpp 0.10.0 exits on SIGINT and loses state; the waiting execution
# client did not promptly detect kernel death. See docs/WIKI_TOP_KERNEL_VALIDATION.md.
id = "cpp-xeus-cling"
display_name = "C++ (xeus-cpp)"
language = "c++"
kernelspec = "xcpp23"
tier = "optional"
project_url = "https://github.com/compiler-research/xeus-cpp"

[kernels.micromamba]
channels = ["conda-forge"]
packages = ["xeus-cpp"]

[[kernels]]
id = "javascript-ijavascript"
display_name = "JavaScript (IJavascript)"
language = "javascript"
kernelspec = "javascript"
tier = "optional"
project_url = "https://github.com/n-riesco/ijavascript"

[kernels.micromamba]
channels = ["conda-forge"]
packages = ["nodejs=18", "jupyter_client"]
setup = [
  ["npm", "install", "--global", "ijavascript"],
  ["ijsinstall"],
]

[[kernels]]
id = "dotnet-csharp"
display_name = ".NET (C#)"
language = "C#"
kernelspec = ".net-csharp"
tier = "optional"
project_url = "https://github.com/dotnet/interactive"

[kernels.micromamba]
channels = ["conda-forge"]
packages = ["dotnet", "nodejs"]
setup = [
  [
    "sh", "-c",
    "if [ -x \"$1/dotnet-interactive\" ]; then \"$1/dotnet-interactive\" --version; else dotnet tool install --tool-path \"$1\" Microsoft.dotnet-interactive; fi",
    "setup-dotnet-tool", "{prefix}/dotnet-tools",
  ],
  ["{prefix}/dotnet-tools/dotnet-interactive", "jupyter", "install", "--path", "{prefix}/share/jupyter/kernels"],
]

